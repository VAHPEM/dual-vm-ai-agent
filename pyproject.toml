[project]
name = "labhand"
version = "0.1.0"
description = "The Muscle: deterministic control of a lab's machines over SSH (Kali + Windows today, more later): run, read, screenshot, Frida, gdb, files."
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Anh Ve Pham (VAHPEM)" }]
dependencies = ["paramiko", "python-dotenv", "pillow"]

[project.optional-dependencies]
# >=1.7: first release with tool annotations. <3: 1.x (FastMCP) and 2.x (MCPServer)
# are both supported and tested; a future major version is not.
mcp = ["mcp>=1.7,<3"]
test = ["pytest"]

[project.urls]
Repository = "https://github.com/VAHPEM/dual-vm-ai-agent"

[project.scripts]
labhand-mcp = "labhand.mcp_server:main"
dualvm-mcp = "labhand.mcp_server:main"      # pre-rename name, kept working
beacon = "beacon.cli:main"
beacon-mcp = "beacon.mcp_server:main"

[tool.setuptools]
# dualvm/ is the deprecated alias of labhand/ (see dualvm/__init__.py)
packages = ["labhand", "dualvm", "beacon"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
# >=77: PEP 639 SPDX `license` string + `license-files`.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
